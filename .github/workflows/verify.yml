name: Verify Softema Hub
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: softema_hub
          POSTGRES_USER: softema_owner
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U softema_owner"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes pnpm@11.25.0 install --frozen-lockfile
      - run: npx --yes pnpm@11.25.0 typecheck
      - run: npx --yes pnpm@11.25.0 test
      - run: npx --yes pnpm@11.25.0 build
      - run: npx --yes pnpm@11.25.0 audit
      # Integration tests: real PostgreSQL, restricted roles, cross-tenant checks. Fictional data only.
      - run: npx --yes pnpm@11.25.0 test:api
        env:
          DATABASE_OWNER_URL: postgresql://softema_owner:ci-only@127.0.0.1:5432/softema_hub
          DATABASE_APP_PASSWORD: ci-app
          DATABASE_APP_URL: postgresql://hub_app:ci-app@127.0.0.1:5432/softema_hub
          DATABASE_AUTH_PASSWORD: ci-auth
          DATABASE_AUTH_URL: postgresql://hub_auth:ci-auth@127.0.0.1:5432/softema_hub
          WEB_ORIGIN: http://localhost:3000
          BETTER_AUTH_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only
          SEED_USER_PASSWORD: ci-only-password
      # Lint is not a gate yet: the original app/ code has known findings.
      # Playwright screenshots are Windows-specific and run locally only.
      # Intentionally no deployment, secrets, emails or database migrations.
