name: Verify Softema Hub
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes pnpm@11.25.0 install --frozen-lockfile
      - run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - run: node --test tests/foundation.test.mjs tests/hub.test.mjs
      - run: npx --yes pnpm@11.25.0 build
      # Lint is not a gate yet: the original app/ code has known findings.
      # Playwright screenshots are Windows-specific and run locally only.
      # Intentionally no deployment, secrets, emails or database migrations.
