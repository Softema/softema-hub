packages:
  - apps/*
  - packages/*
# Supply-chain policy: only releases older than 7 days, verified lockfile,
# install scripts only for the packages listed in allowBuilds.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  sharp: true
  unrs-resolver: true
  '@prisma/engines': true
  prisma: true
  turbo: false
  esbuild: true
# Project-local pnpm store (path kept from the original export; moving it
# requires a fresh install). SITES_PNPM_SHARED_STORE may still override it.
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
packageImportMethod: clone-or-copy
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
# Security floors for transitive packages that the direct dependencies do not raise on their own.
overrides:
  browserslist: ^4.29.5
  baseline-browser-mapping: ^2.11.0
  fast-uri: ^3.1.9
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  js-yaml@4: ^4.3.2
  minimatch@10: ^11.0.1
  esbuild: ^0.28.1
# Known advisories without a fix that do not reach the app. Each entry needs a reason;
# remove it as soon as a patched version exists.
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS (18. 11. 2026, no patched version yet). Only the dev lint and
    # build tooling uses it on globs from our own config, never on user input, and it
    # is not part of the web or API runtime (`pnpm audit --prod` is clean).
    - GHSA-fc5q-39xc-vjpf
